<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // 화면 깜빡임 방지: CSS보다 먼저 테마를 적용
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="16×16 격자에 도트를 찍어 그리고 PNG로 저장하는 픽셀 아트 에디터">
  <title>픽셀 아트 에디터</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="back-link" href="../../index.html">← 블로그</a>
    <h1 class="app-title">픽셀 아트 에디터</h1>
    <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <main class="app-main">
    <div class="stage-wrap">
      <div class="stage" id="stage">
        <canvas class="art-canvas" id="canvas" width="16" height="16" tabindex="0"
          aria-label="그림판, 방향키로 칸 이동, Space로 칠하기"></canvas>
        <div class="grid-overlay" id="grid-overlay" aria-hidden="true"></div>
        <div class="cell-cursor" id="cursor" aria-hidden="true" hidden></div>
      </div>
    </div>

    <div class="panel">
      <div class="toolbar" role="toolbar" aria-label="도구">
        <button class="icon-btn" type="button" data-tool="pen" aria-label="펜" title="펜 (B)" aria-pressed="true">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        </button>
        <button class="icon-btn" type="button" data-tool="eraser" aria-label="지우개" title="지우개 (E)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H8.5L3.7 15.2a1.5 1.5 0 0 1 0-2.1L13.1 3.7a1.5 1.5 0 0 1 2.1 0l5.2 5.2a1.5 1.5 0 0 1 0 2.1L11.5 20"/><path d="M8.6 8.2l7.2 7.2"/></svg>
        </button>
        <button class="icon-btn" type="button" data-tool="fill" aria-label="채우기" title="채우기 (F)" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11l7-7 8 8-7 7a2 2 0 0 1-2.8 0L5 13.8a2 2 0 0 1 0-2.8z"/><path d="M5 12h15"/><path d="M21 17c0 1.4-1 2.5-1.5 3-.5-.5-1.5-1.6-1.5-3a1.5 1.5 0 0 1 3 0z"/></svg>
        </button>
        <span class="toolbar-sep" aria-hidden="true"></span>
        <button class="icon-btn" type="button" id="undo" aria-label="실행 취소" title="실행 취소 (Ctrl+Z)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        </button>
        <button class="icon-btn" type="button" id="redo" aria-label="다시 실행" title="다시 실행 (Ctrl+Shift+Z)" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
        </button>
      </div>

      <div class="current-color">
        <span class="current-swatch" id="current-swatch" aria-hidden="true"></span>
        <span id="current-text">현재 색: 검정 (#000000)</span>
      </div>

      <div class="palette" id="palette" role="group" aria-label="팔레트">
        <input class="swatch swatch-custom" type="color" id="custom-color" value="#ff8800"
          aria-label="사용자 지정 색" title="사용자 지정 색">
      </div>

      <div class="actions">
        <div class="action-group">
          <button class="btn btn-secondary" type="button" id="grid-toggle" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></svg>
            격자선
          </button>
          <button class="btn btn-secondary" type="button" id="clear">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>
            전체 지우기
          </button>
        </div>
        <div class="action-group">
          <label class="scale-label" for="scale">배율</label>
          <select class="scale-select" id="scale">
            <option value="1">1× (16px)</option>
            <option value="8">8× (128px)</option>
            <option value="16" selected>16× (256px)</option>
            <option value="32">32× (512px)</option>
          </select>
          <button class="btn btn-primary" type="button" id="save-png">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
            PNG 저장
          </button>
        </div>
      </div>

      <p class="shortcut-hint">
        단축키: <kbd>B</kbd> 펜 · <kbd>E</kbd> 지우개 · <kbd>F</kbd> 채우기 · <kbd>G</kbd> 격자선 ·
        <kbd>Ctrl</kbd>+<kbd>Z</kbd> 실행 취소 · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>Z</kbd> 다시 실행 ·
        그림판에서 방향키로 이동, <kbd>Space</kbd>로 칠하기
      </p>
    </div>

    <p class="visually-hidden" id="live" aria-live="polite"></p>
  </main>
</body>
</html>
