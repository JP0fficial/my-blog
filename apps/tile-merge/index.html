<!DOCTYPE html>
<html lang="ko">
<head>
  <script>
    // 화면 깜빡임 방지: CSS보다 먼저 테마를 적용
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (dark ? 'dark' : 'light');
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="같은 숫자 타일을 밀어 합치는 슬라이딩 퍼즐">
  <title>타일 합치기</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="back-link" href="../../index.html">← 블로그</a>
    <h1 class="app-title">타일 합치기</h1>
    <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <main class="app-main">
    <section class="scoreboard" aria-label="점수판">
      <div class="score-box">
        <span class="score-label">점수</span>
        <span class="score-value" id="score">0</span>
        <span class="score-float-layer" id="score-float" aria-hidden="true"></span>
      </div>
      <div class="score-box">
        <span class="score-label">최고 점수</span>
        <span class="score-value" id="best">0</span>
      </div>
    </section>

    <button class="btn" type="button" id="new-game">새 게임</button>

    <div class="board" id="board" tabindex="0" aria-label="게임판, 방향키로 타일 이동">
      <div class="cell-layer" aria-hidden="true"></div>
      <div class="tile-layer" id="tile-layer" aria-hidden="true"></div>
      <div class="overlay" id="overlay" hidden>
        <p class="overlay-title">더 이상 움직일 수 없습니다</p>
        <p class="overlay-score">최종 점수 <strong id="final-score">0</strong>점</p>
        <p class="overlay-best" id="overlay-best" hidden>최고 점수 갱신!</p>
        <button class="btn" type="button" id="retry">다시 하기</button>
      </div>
    </div>

    <p class="hint">방향키 · WASD · 스와이프로 이동</p>

    <p class="visually-hidden" id="live" aria-live="polite"></p>
    <p class="visually-hidden" id="alert" role="alert"></p>
  </main>
</body>
</html>
